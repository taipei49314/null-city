name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref, keep concurrent runs on different refs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches `engines.node` (>=20) and `packageManager` in package.json — one
  # coherent version claim across docs, CI, and the Dockerfile.
  NODE_VERSION: "20"
  PNPM_VERSION: "10.33.0"

jobs:
  verify:
    name: Lint, typecheck, build, tests, determinism, package/tarball smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this is also the fresh-clone reproduction environment)
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: pnpm verify
        run: pnpm verify

      - name: Command Center smoke flow (real server + built preview bundle)
        run: pnpm command-center:e2e

      - name: Dependency review (informational; not a required gate)
        run: pnpm audit --prod
        continue-on-error: true

      - name: Build release archive + checksum
        run: pnpm release:archive

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: data/release/*
          if-no-files-found: error

  docker-smoke:
    name: Docker build + compose smoke (required)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Docker smoke (build, health, one real scenario session, teardown)
        run: node scripts/verify-docker-smoke.mjs
